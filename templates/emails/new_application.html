<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
        }

        .header {
            background-color: #1e6f63;
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 8px 8px 0 0;
        }

        .content {
            padding: 20px;
        }

        .footer {
            text-align: center;
            color: #888;
            font-size: 12px;
            margin-top: 20px;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #1e6f63;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>New Application Received</h1>
        </div>
        <div class="content">
            <p>Hello {{ recruiter_name }},</p>
            <p>You have received a new application for the position of <strong>{{ job_title }}</strong>.</p>
            <p><strong>Candidate:</strong> {{ candidate_name }}</p>
            <p><strong>Email:</strong> {{ candidate_email }}</p>
            <p style="text-align: center; margin-top: 30px;">
                <a href="{{ dashboard_url }}" class="btn">View Application</a>
            </p>
            <p>Best regards,<br>The JobPortal Team</p>
        </div>
        <div class="footer">
            &copy; 2026 JobPortal. All rights reserved.
        </div>
    </div>
</body>

</html>
